services:
  plex-orphan-watcher:
    build: .
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PLEX_URL: http://plex:32400
      PLEX_TOKEN_FILE: /run/secrets/plex_token
      DELETE_ROOTS: /data/internal/media,/data/usb_drive/media
      AUDIT_ROOTS: /data/internal/torrents,/data/usb_drive/torrents
      STATE_PATH: /state/watcher.db
      DRY_RUN: "true"
      SETTLE_DELAY: 15m
      RECONCILE_INTERVAL: 1h
      HEALTH_ADDRESS: :8080
    volumes:
      - ./state:/state
      - /mnt/internal/media:/data/internal/media:ro
      - /mnt/usb_drive/media:/data/usb_drive/media:ro
      - /mnt/internal/torrents:/data/internal/torrents:ro
      - /mnt/usb_drive/torrents:/data/usb_drive/torrents:ro
    secrets:
      - plex_token

secrets:
  plex_token:
    file: ./secrets/plex_token
